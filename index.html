<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ツナグ先生 ― 統合校務支援（個人用）</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--teal:#2f6f6a;--teal-d:#24584f;--bg:#f4f6f5;--card:#fff;--line:#d8e0dc;--ink:#22312d;--mut:#64766f;--warn:#b3541e;--warnbg:#fdf1e7;--bad:#b02a2a;--badbg:#fbeaea;--ok:#2e7d32;--okbg:#e9f5ea;--cap:#7b4fa6;--capbg:#f2eaf9}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header.top{background:var(--teal);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top h1{font-size:19px;margin:0;font-weight:700}
header.top .sub{font-size:12px;opacity:.85}
.ctxbar{background:#e8efec;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctxbar label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.ctxbar select{font-size:14px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff}
.layout{display:flex;min-height:calc(100vh - 110px)}
nav.side{width:196px;flex:none;background:#eef3f1;border-right:1px solid var(--line);padding:10px 0}
nav.side button{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 16px;font-size:14px;cursor:pointer;color:var(--ink)}
nav.side button:hover{background:#e0eae6}
nav.side button.on{background:var(--teal);color:#fff;font-weight:700}
nav.side .grp{font-size:11px;color:var(--mut);padding:10px 16px 2px}
main{flex:1;padding:16px 20px;overflow-x:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px;color:var(--teal-d)}
.card h3{font-size:14px;margin:14px 0 6px;color:var(--teal-d)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:center;vertical-align:middle}
th{background:#eef3f1;font-weight:700}
td.l,th.l{text-align:left}
input[type=text],input[type=number],input[type=date],select,textarea{font-size:14px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-family:inherit}
input.score{width:56px;text-align:center}
textarea{width:100%;box-sizing:border-box}
button.btn{background:var(--teal);color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer}
button.btn:hover{background:var(--teal-d)}
button.btn.sub{background:#fff;color:var(--teal-d);border:1px solid var(--teal)}
button.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
button.btn:disabled{background:#b9c6c1;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.note{font-size:12px;color:var(--mut)}
.warnbox{background:var(--warnbg);border:1px solid #e8c39a;border-radius:8px;padding:10px 12px;margin:10px 0}
.badbox{background:var(--badbg);border:1px solid #e0a3a3;border-radius:8px;padding:10px 12px;margin:10px 0}
.okbox{background:var(--okbg);border:1px solid #a9cfa9;border-radius:8px;padding:10px 12px;margin:10px 0}
.capmark{color:var(--cap);font-weight:700}
.flagmark{color:var(--warn);font-weight:700}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0}
.bar .lab{width:52px;text-align:right;font-size:12px;color:var(--mut)}
.bar .track{flex:1;background:#e6ecea;border-radius:4px;height:16px;position:relative}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:4px}
.bar .val{font-size:12px;width:86px}
td.low{background:var(--badbg)}td.high{background:var(--okbg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:#fff;border-radius:10px;padding:18px;max-width:640px;width:92%;max-height:86vh;overflow-y:auto}
pre.prev{background:#f6f8f7;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;font-size:12px;max-height:300px;overflow-y:auto}
.toast{position:fixed;right:16px;bottom:16px;background:var(--teal-d);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:13px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.kpi{background:#eef3f1;border-radius:8px;padding:10px 12px}
.kpi b{font-size:20px;display:block}
@media print{body>*{display:none}#printArea{display:block!important}body{margin:0}}
#printArea{display:none}
.sheet{page-break-after:always;padding:10mm;font-size:12px}
.sheet h2{font-size:16px;border-bottom:2px solid #333;padding-bottom:4px}
.sheet table th,.sheet table td{border:1px solid #666}
</style>
</head>

function sjisEncode(str){
  const out=[];
  for(const ch of String(str)){
    const cp=ch.codePointAt(0);
    if(cp<0x80){out.push(cp);continue;}
    if(cp>=0xFF61&&cp<=0xFF9F){out.push(cp-0xFF61+0xA1);continue;}
    const i=SJIS_CH.indexOf(ch);
    if(i>=0){const c=SJIS_CD.charCodeAt(i);out.push(c>>8,c&0xFF);}
    else out.push(0x3F);
  }
  return new Uint8Array(out);
}

/* CSV */
function parseCSV(text){
  const rows=[];let row=[],cur="",q=false;
  text=String(text).replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c=='"')q=true;
    else if(c===","){row.push(cur);cur="";}
    else if(c=="\n"){row.push(cur);rows.push(row);row=[];cur="";}
    else if(c=="\r"){}
    else cur+=c;}
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.length>1||(r.length===1&&r[0].trim()!==""));
}
function parseTSV(text){return String(text).replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim()!=="").map(l=>l.split("\t"));}
function csvCell(v){v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCSV(rows){return rows.map(r=>r.map(csvCell).join(",")).join("\r\n");}
function download(name,content,mime){
  let blob;
  if(content instanceof Uint8Array)blob=new Blob([content],{type:mime||"text/csv"});
  else blob=new Blob([content],{type:mime||"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},300);
}
function downloadCSV(name,rows,encoding){
  const text=toCSV(rows);
  if(encoding==="sjis")download(name,sjisEncode(text),"text/csv");
  else download(name,"\uFEFF"+text,"text/csv;charset=utf-8");
}
function readFileText(file,encoding){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(file,encoding||"UTF-8");});
}
async function readCSVFile(file){
  const buf=await file.arrayBuffer();
  let text=new TextDecoder("utf-8").decode(buf);
  if(text.includes("\uFFFD")){try{text=new TextDecoder("shift_jis").decode(buf);}catch(e){}}
  return parseCSV(text);
}

function fixCtx(){
  const d=YD(),c=S.ctx;
  if(!termList().find(t=>t.id===c.term)){c.term=termList()[0].id;}
  const subjsWithAsg=[...new Set(d.assignments.map(a=>a.subjectId))];
  if(c.mode==="subject"){
    if(!subjsWithAsg.includes(c.subjectId))c.subjectId=subjsWithAsg[0]||"";
    const grades=[...new Set(d.assignments.filter(a=>a.subjectId===c.subjectId).map(a=>{const cl=getClass(a.classId);return cl?cl.grade:null;}).filter(g=>g!=null))].sort();
    if(!grades.map(String).includes(String(c.grade)))c.grade=grades.length?String(grades[0]):"";
    const clss=d.assignments.filter(a=>a.subjectId===c.subjectId).map(a=>getClass(a.classId)).filter(cl=>cl&&String(cl.grade)===String(c.grade));
    if(!clss.find(cl=>cl.id===c.classId))c.classId=clss.length?clss[0].id:"";
  }
  if(c.mode==="grade"){
    const gs=gradesPresent();if(!gs.map(String).includes(String(c.aggGrade)))c.aggGrade=gs.length?String(gs[0]):"1";
  }
}

/* ================= Mapping presets (shared import/export base) ================= */
function ensureMaps(){if(!S.mappingPresets)S.mappingPresets=[];}
function getPresets(kind,dataset){ensureMaps();return S.mappingPresets.filter(p=>p.kind===kind&&p.dataset===dataset);}
function savePreset(kind,dataset,name,map,encoding){
  ensureMaps();
  const ex=S.mappingPresets.find(p=>p.kind===kind&&p.dataset===dataset&&p.name===name);
  if(ex){ex.map=clone(map);ex.encoding=encoding||ex.encoding;}
  else S.mappingPresets.push({id:uid("pre"),kind,dataset,name,map:clone(map),encoding:encoding||"utf8"});
  save();
}
function deletePreset(id){ensureMaps();S.mappingPresets=S.mappingPresets.filter(p=>p.id!==id);save();renderAll();}
function exportPresetsFile(){
  ensureMaps();
  if(!S.mappingPresets.length){toast("プリセットがまだありません");return;}
  download("tsunagu-mapping-presets.json",JSON.stringify(S.mappingPresets,null,1),"application/json");
  toast("プリセットを書き出しました");
}
async function importPresetsFile(input){
  const f=input.files[0];if(!f)return;
  try{
    const data=JSON.parse(await readFileText(f));
    if(!Array.isArray(data))throw new Error("bad");
    confirmDlg("プリセット"+data.length+"件を読み込みます。同名のプリセットは上書きされます。よろしいですか？",()=>{
      data.forEach(p=>{if(p&&p.kind&&p.dataset&&p.name)savePreset(p.kind,p.dataset,p.name,p.map,p.encoding);});
      renderAll();toast("プリセットを読み込みました");
    });
  }catch(e){toast("プリセットファイルの形式が正しくありません");}
  input.value="";
}

  h+='<div class="btnrow"><button class="btn" onclick="doRosterImport()">取り込む</button></div><div id="impReport"></div>';

}
function doRosterImport(){
  const rows=V.impRows;if(!rows)return;
  const m=rosterMapFromUI();const d=YD();
  const start=m.header?1:0;const report={added:0,skipped:[],warnings:[]};
  const seen=new Set();
  for(let i=start;i<rows.length;i++){
    const r=rows[i];const get=k=>m[k]>=0?(r[m[k]]==null?"":String(r[m[k]]).trim()):"";
    const name=get("name");
    if(!name){report.skipped.push({row:i+1,reason:"氏名が空です"});continue;}
    let no=null;const noRaw=get("no");
    if(noRaw!==""){no=parseInt(noRaw);if(isNaN(no)||no<0||no>999){report.warnings.push({row:i+1,reason:"出席番号「"+noRaw+"」が不正なため番号なしで取り込みました"});no=null;}}
    let cid=m.target;
    const clsRaw=get("class");
    if(clsRaw){
      const mm=clsRaw.match(/(\d+)\s*年\s*(.+)/);
      if(mm){const g=parseInt(mm[1]),nm=mm[2].trim();let cl=d.classes.find(c=>c.grade===g&&c.name===nm);if(!cl){cl={id:uid("cls"),grade:g,name:nm};d.classes.push(cl);}cid=cl.id;}
      else report.warnings.push({row:i+1,reason:"クラス「"+clsRaw+"」を解釈できず、取り込み先クラスに入れました"});
    }
    const key=cid+"|"+name;
    if(seen.has(key)||d.students.some(s=>s.classId===cid&&s.name===name)){report.skipped.push({row:i+1,reason:"重複："+name+"（同じクラスに同名がいます）"});continue;}
    seen.add(key);
    const genderRaw=get("gender");const gender=genderRaw.includes("女")?"女":"男";
    d.students.push({id:uid("stu"),name,kana:get("kana"),no,classId:cid,gender,status:"在籍",note:""});
    report.added++;
  }
  save();

/* ================= Compute engine ================= */
function subjCfg(subjectId){const d=YD();if(!d.subjCfg[subjectId])d.subjCfg[subjectId]=defaultSubjCfg(ratingScale());return d.subjCfg[subjectId];}
function ratingFromCuts(rate,cuts){if(rate==null)return null;for(let i=0;i<cuts.length;i++){if(rate>=cuts[i])return cuts.length+1-i;}return 1;}
function abcOf(rate,cfg){if(rate==null)return null;if(rate>=cfg.abA)return "A";if(rate>=cfg.abB)return "B";return "C";}
function computeStudent(mats,scoresByMat,cfg,scale){
  const per=mats.map(m=>{const raw=scoresByMat?scoresByMat[m.id]:undefined;const v=(raw===undefined||raw===null||raw==="")?null:num(raw);
    return {mat:m,score:v,rate:(v==null||!m.max)?null:v/m.max*100};});
  const entered=per.filter(p=>p.rate!=null);
  let totalRate=null;
  if(entered.length){let sw=0,sr=0;entered.forEach(p=>{const w=p.mat.weight||1;sw+=w;sr+=p.rate*w;});totalRate=sr/sw;}
  const viewRates=[0,1,2].map(v=>{let sw=0,sr=0;entered.forEach(p=>{const a=(p.mat.alloc[v]||0)/100*(p.mat.weight||1);if(a>0){sw+=a;sr+=p.rate*a;}});return sw>0?sr/sw:null;});
  const abcs=viewRates.map(r=>abcOf(r,cfg));
  let base=null;const caps=[];
  const cuts=scale===10?cfg.cuts10:cfg.cuts5;
  if(cfg.method==="2"){
    if(abcs.every(a=>a)){const key=[...abcs].sort((x,y)=>"ABC".indexOf(x)-"ABC".indexOf(y)).join("");base=(cfg.table[key]!=null?cfg.table[key]:null);}
  }else{
    base=ratingFromCuts(totalRate,cuts);
    if(cfg.method==="3"&&base!=null){
      cfg.guards.forEach(g=>{
        if(!g.on)return;let hit=false;
        if(g.id==="anyC")hit=abcs.includes("C");
        else if(g.id==="noA")hit=abcs.some(a=>a!==null)&&abcs.every(a=>a!=="A");
        else if(g.id==="twoC")hit=abcs.filter(a=>a==="C").length>=2;
        if(hit&&base>g.limit)caps.push({label:g.label,limit:g.limit});
      });
      if(caps.length)base=Math.min(base,...caps.map(c=>c.limit));
    }
  }
  return {per,totalRate,viewRates,abcs,base,caps};
}
function computeClassRows(subjectId,classId,term){
  const d=YD();const cfg=subjCfg(subjectId);const scale=ratingScale();
  const mats=d.materials.filter(m=>m.subjectId===subjectId&&m.classId===classId&&m.term===term);
  const rows=studentsOfClass(classId,true).map(s=>{
    const sbm={};mats.forEach(m=>{const sc=(d.scores[m.id]||{})[s.id];if(sc!==undefined&&sc!==null)sbm[m.id]=sc;});
    const r=computeStudent(mats,sbm,cfg,scale);
    const adj=d.adjustments[subjectId+"|"+term+"|"+classId+"|"+s.id]||null;
    const final=(adj&&adj.rating!=null)?adj.rating:r.base;
    return Object.assign({student:s,adj,final,classRank:null,gradeRank:null},r);
  });
  return {rows,mats,cfg,scale};
}
function assignRanks(rows,field){
  const sorted=rows.filter(r=>r.totalRate!=null).slice().sort((a,b)=>b.totalRate-a.totalRate);
  let prev=null,rank=0;
  sorted.forEach((r,i)=>{if(prev===null||r.totalRate!==prev){rank=i+1;prev=r.totalRate;}r[field]=rank;});
}
function computeSubject(subjectId,classId,term){
  const res=computeClassRows(subjectId,classId,term);
  assignRanks(res.rows,"classRank");
  const cl=getClass(classId);
  if(cl){
    let pool=res.rows.slice();
    YD().assignments.filter(a=>a.subjectId===subjectId&&a.classId!==classId).forEach(a=>{
      const c2=getClass(a.classId);if(c2&&c2.grade===cl.grade)pool=pool.concat(computeClassRows(subjectId,a.classId,term).rows);
    });
    const byId={};pool.forEach(r=>{byId[r.student.id]=r;});
    assignRanks(pool,"gradeRank");
    res.rows.forEach(r=>{const p=byId[r.student.id];if(p)r.gradeRank=p.gradeRank;});
  }
  return res;
}
function findInversions(rows){
  const out=[];
  for(let i=0;i<rows.length;i++)for(let j=0;j<rows.length;j++){
    const a=rows[i],b=rows[j];
    if(a.totalRate!=null&&b.totalRate!=null&&a.final!=null&&b.final!=null&&a.totalRate>b.totalRate&&a.final<b.final)
      out.push({hi:a,lo:b});
  }
  return out;
}
function findBoundary(rows,cfg,scale){
  const out=[];const cuts=scale===10?cfg.cuts10:cfg.cuts5;
  rows.forEach(r=>{
    if(r.totalRate!=null&&cfg.method!=="2")cuts.forEach(c=>{if(Math.abs(r.totalRate-c)<=2)out.push({student:r.student,what:"総合得点率",value:r.totalRate,cut:c});});
    r.viewRates.forEach((v,i)=>{if(v==null)return;[cfg.abA,cfg.abB].forEach(c=>{if(Math.abs(v-c)<=2)out.push({student:r.student,what:"観点"+(i+1)+"（"+VIEWPOINTS[i]+"）",value:v,cut:c});});});
  });
  return out;
}
function comboViolations(table){
  const val={A:3,B:2,C:1};const viol=[];
  COMBOS.forEach(c1=>{const arr=c1.split("");
    for(let i=0;i<3;i++){if(arr[i]==="A")continue;const a2=arr.slice();a2[i]=arr[i]==="C"?"B":"A";
      const c2=a2.sort((x,y)=>val[y]-val[x]).join("");
      if(table[c2]!=null&&table[c1]!=null&&table[c2]<table[c1])viol.push({worse:c1,better:c2,r1:table[c1],r2:table[c2]});}});
  return viol;
}

function bindScoreGrid(){
  const grid=document.getElementById("scoreGrid");if(!grid)return;
  const inputs=[...grid.querySelectorAll("input.score")];
  const byPos={};inputs.forEach(i=>{byPos[i.dataset.r+","+i.dataset.c]=i;});
  inputs.forEach(inp=>{
    inp.addEventListener("input",()=>{
      const d=YD();const mid=inp.dataset.mat,sid=inp.dataset.sid;
      if(!d.scores[mid])d.scores[mid]={};
      if(inp.value==="")delete d.scores[mid][sid];else d.scores[mid][sid]=parseFloat(inp.value);
      save();
    });
    inp.addEventListener("keydown",e=>{
      const r=+inp.dataset.r,c=+inp.dataset.c;let t=null;
      if(e.key==="Enter"||e.key==="ArrowDown")t=byPos[(r+1)+","+c];
      else if(e.key==="ArrowUp")t=byPos[(r-1)+","+c];
      else if(e.key==="ArrowRight")t=byPos[r+","+(c+1)];
      else if(e.key==="ArrowLeft")t=byPos[r+","+(c-1)];
      if(t){e.preventDefault();t.focus();t.select();}
    });
    inp.addEventListener("paste",e=>{
      const text=(e.clipboardData||window.clipboardData).getData("text");
      if(!text||(!text.includes("\t")&&!text.includes("\n")))return;
      e.preventDefault();
      const rows=parseTSV(text);const d=YD();
      const r0=+inp.dataset.r,c0=+inp.dataset.c;
      rows.forEach((row,dr)=>{row.forEach((cell,dc)=>{
        const t=byPos[(r0+dr)+","+(c0+dc)];if(!t)return;
        const v=cell.trim();t.value=v;
        if(!d.scores[t.dataset.mat])d.scores[t.dataset.mat]={};
        if(v==="")delete d.scores[t.dataset.mat][t.dataset.sid];else{const n=parseFloat(v);if(!isNaN(n))d.scores[t.dataset.mat][t.dataset.sid]=n;}
      });});
      save();renderAll();toast("貼り付け入力しました");
    });
  });
}

function viewGrading(){
  const asg=curAssignment();
  let h='<div class="card"><h2>評定の確定</h2>'+purpose("観点別評価と評定を自動計算し、根拠を確認しながら確定します。設定は既定値のままで使えます。直したいときだけ下の「計算の設定」を開いてください。");
  if(!asg){h+='<p class="note">上のバーで教科・学年・クラスを選んでください。</p></div>';return h;}
  const d=YD();const subj=getSubject(asg.subjectId),cls=getClass(asg.classId);
  const res=computeSubject(asg.subjectId,asg.classId,S.ctx.term);
  const cfg=res.cfg,scale=res.scale;
  h+="<p><b>"+esc(subj?subj.name:"")+" ／ "+esc(cls?classLabel(cls):"")+" ／ "+esc(termLabel(S.ctx.term))+"</b>　評定方式："+({1:"方式1 総合得点率",2:"方式2 観点の組み合わせ表",3:"方式3 ハイブリッド（推奨）"})[cfg.method]+'</p>';
  if(!res.mats.length){h+='<p class="note">評価材料がありません。「担当と評価材料」で用意してください。</p></div>';return h;}
  // distribution
  const dist={};res.rows.forEach(r=>{if(r.final!=null)dist[r.final]=(dist[r.final]||0)+1;});
  const total=res.rows.filter(r=>r.final!=null).length;
  h+="<h3>評定の分布</h3>"+[ ...Array(scale).keys()].map(i=>{const rt=scale-i;const n=dist[rt]||0;const pct=total?Math.round(n/total*100):0;
    return '<div class="bar"><span class="lab">評定'+rt+'</span><span class="track"><span class="fill" style="width:'+pct+'%"></span></span><span class="val">'+n+"人（"+pct+"%）</span></div>";}).join("");
  const rates=res.rows.map(r=>r.totalRate).filter(v=>v!=null);
  if(rates.length){
    const avg=rates.reduce((a,b)=>a+b,0)/rates.length;
    const buckets=Array(10).fill(0);rates.forEach(r=>{buckets[Math.min(9,Math.floor(r/10))]++;});
    const mx=Math.max(...buckets,1);
    h+="<h3>総合得点率の統計</h3><p>平均 "+fmt(avg)+"％／最高 "+fmt(Math.max(...rates))+"％／最低 "+fmt(Math.min(...rates))+"％</p>"
      +buckets.map((n,i)=>'<div class="bar"><span class="lab">'+(i*10)+"〜</span><span class=\"track\"><span class=\"fill\" style=\"width:"+Math.round(n/mx*100)+'%"></span></span><span class="val">'+n+"人</span></div>").join("");
  }
  // inversions
  const inv=findInversions(res.rows);
  const ackKey=asg.subjectId+"|"+S.ctx.term+"|"+asg.classId;
  const acks=(YD().inversionAck[ackKey]||[]);
  const invOpen=inv.filter(p=>!acks.includes(p.hi.student.id+">"+p.lo.student.id));
  if(invOpen.length){
    h+='<div class="warnbox"><b>逆転チェック：</b>総合得点率が高いのに評定が低くなっている組み合わせがあります。<ul>'
      +invOpen.map(p=>"<li>"+esc(p.hi.student.name)+"（"+fmt(p.hi.totalRate)+"％→評定"+p.hi.final+"）と "+esc(p.lo.student.name)+"（"+fmt(p.lo.totalRate)+"％→評定"+p.lo.final+"） "
        +'<button class="btn sub" onclick="ackInversion(\''+p.hi.student.id+"','"+p.lo.student.id+'\')">理由を確認して承認</button></li>').join("")+"</ul>"
      +'<span class="note">方式3のキャップや人間調整で意図的に起きる場合は「承認」してください。</span></div>';
  }else if(inv.length){h+='<div class="okbox">逆転ペアはすべて承認済みです（'+inv.length+"件）。</div>";}
  // boundary
  const bnd=findBoundary(res.rows,cfg,scale);
  if(bnd.length){
    h+='<div class="warnbox"><b>境界付近（カッティングポイント前後2％以内）：</b><ul>'
      +bnd.map(b=>"<li>"+esc(b.student.name)+"："+esc(b.what)+" "+fmt(b.value)+"％（基準 "+b.cut+"％）</li>").join("")+"</ul>"
      +'<span class="note">人間調整の判断材料にしてください。</span></div>';
  }
  // results table with rationale expansion
  h+='<h3>評定一覧</h3><p><button class="btn sub" onclick="copyGradingTable()">表をコピー（Excelへ貼り付け用）</button> <button class="btn" onclick="goExportGrades()">CSVで書き出す（学校システム用）</button></p>';
  h+="<table><tr><th>番号</th><th>氏名</th><th>総合得点率</th>"+VIEWPOINTS.map((v,i)=>"<th>観点"+(i+1)+"<br><span class=\"note\">"+esc(v)+"</span></th>").join("")+"<th>自動評定</th><th>確定評定</th><th>順位<br>（クラス／学年）</th><th>根拠</th></tr>";
  res.rows.forEach(r=>{
    const capped=r.caps.length>0;
    const adjDiff=r.adj&&r.adj.rating!=null&&r.base!=null&&r.adj.rating!==r.base;
    h+="<tr><td>"+r.student.no+"</td><td class=\"l\">"+esc(r.student.name)+"</td><td>"+fmt(r.totalRate)+"</td>"
      +r.abcs.map((a,i)=>"<td>"+(a||"―")+'<br><span class="note">'+fmt(r.viewRates[i])+"%</span></td>").join("")
      +"<td>"+(r.base==null?"―":r.base)+(capped?' <span class="capmark" title="観点のガードルールで上限がかかりました">⚑キャップ</span>':"")+"</td>"
      +"<td>"+(r.final==null?"―":r.final)+(adjDiff?' <span class="flagmark">⚠調整</span>':"")+"</td>"
      +"<td>"+(r.classRank||"―")+"／"+(r.gradeRank||"―")+"</td>"
      +'<td><button class="btn sub" onclick="toggleWhy(\''+r.student.id+'\')">なぜこの評定？</button></td></tr>'
      +'<tr id="why_'+r.student.id+'" style="display:none"><td colspan="9" class="l">'+whyHtml(r,cfg)+"</td></tr>";
    if(adjDiff||(r.adj&&r.adj.rating!=null)){
      h+='<tr><td colspan="9" class="l">調整理由 <input type="text" style="width:70%" value="'+esc(r.adj.reason||"")+'" onchange="setAdjReason(\''+r.student.id+'\',this.value)"> '+(!r.adj.reason?'<span class="flagmark">理由を記入してください</span>':"")+"</td></tr>";
    }
  });
  h+="</table>"
    +'<p class="note">確定評定を変えるときは、表の生徒を選んで下の「人間調整」で打ち替えてください。自動評定と違う場合は理由の記入が必要です。</p>'
    +'<p>人間調整： <select id="adjStudent">'+res.rows.map(r=>'<option value="'+r.student.id+'">'+r.student.no+" "+esc(r.student.name)+"</option>").join("")+"</select> "
    +'確定評定 <select id="adjRating"><option value="">（自動のまま）</option>'+[...Array(scale).keys()].map(i=>"<option>"+(scale-i)+"</option>").join("")+"</select> "
    +'<input type="text" id="adjReason" placeholder="理由（例：実技の伸びを評価）"> <button class="btn sub" onclick="applyAdj()">調整を反映</button></p>';
  // settings (collapsed by default)
  h+='<details><summary style="cursor:pointer;font-weight:700;color:var(--teal-d)">計算の設定（直したい人だけ）</summary>'+cfgHtml(cfg,scale)+"</details></div>";
  return h;
}

/* ================= Aggregate （学年集約） ================= */
function aggregateData(term,grade){
  const d=YD();const scale=ratingScale();
  const classes=d.classes.filter(c=>String(c.grade)===String(grade));
  const classIds=classes.map(c=>c.id);
  const students=d.students.filter(s=>classIds.includes(s.classId)&&s.status==="在籍").sort((a,b)=>a.classId===b.classId?(a.no||0)-(b.no||0):(classLabel(getClass(a.classId))<classLabel(getClass(b.classId))?-1:1));
  const ownSubjIds=[...new Set(d.assignments.filter(a=>classIds.includes(a.classId)).map(a=>a.subjectId))];
  const cache={};
  function ownRating(subjectId,student){
    const asg=d.assignments.find(a=>a.subjectId===subjectId&&a.classId===student.classId);if(!asg)return null;
    const key=subjectId+"|"+student.classId;
    if(!cache[key])cache[key]=computeClassRows(subjectId,student.classId,term).rows;
    const row=cache[key].find(r=>r.student.id===student.id);return row?row.final:null;
  }
  const subjects=[...ownSubjIds.map(id=>({name:getSubject(id)?getSubject(id).name:"?",own:true,subjectId:id})),
                  ...d.otherSubjects.map(n=>({name:n,own:false}))];
  const rows=students.map(s=>{
    const ratings={};
    subjects.forEach(sub=>{ratings[sub.name]=sub.own?ownRating(sub.subjectId,s):(((d.otherGrades[term]||{})[s.id]||{})[sub.name]!=null?((d.otherGrades[term]||{})[s.id]||{})[sub.name]:null);});
    const vals=Object.values(ratings).filter(v=>v!=null);
    const total=vals.length?vals.reduce((a,b)=>a+b,0):null;
    const avg=vals.length?total/vals.length:null;
    const spread=vals.length>1?Math.max(...vals)-Math.min(...vals):0;
    return {student:s,ratings,total,avg,count:vals.length,spread,gradeRank:null,classRank:null};
  });
  const rankOf=(list,field)=>{
    const sorted=list.filter(r=>r.total!=null).slice().sort((a,b)=>b.total-a.total);
    let prev=null,rank=0;sorted.forEach((r,i)=>{if(prev===null||r.total!==prev){rank=i+1;prev=r.total;}r[field]=rank;});
  };
  rankOf(rows,"gradeRank");
  classes.forEach(c=>rankOf(rows.filter(r=>r.student.classId===c.id),"classRank"));
  const dist={};
  subjects.forEach(sub=>{dist[sub.name]={};for(let i=1;i<=scale;i++)dist[sub.name][i]=0;rows.forEach(r=>{const v=r.ratings[sub.name];if(v!=null&&dist[sub.name][v]!=null)dist[sub.name][v]++;});});
  return {subjects,rows,dist,scale,classes};
}
function prevTermId(term){const ids=termList().map(t=>t.id);const i=ids.indexOf(term);return i>0?ids[i-1]:null;}
function watchList(term,grade){
  const cur=aggregateData(term,grade);const prevId=prevTermId(term);
  const prev=prevId?aggregateData(prevId,grade):null;
  const prevMap={};if(prev)prev.rows.forEach(r=>{prevMap[r.student.id]=r;});
  const out=[];
  cur.rows.forEach(r=>{
    const reasons=[];
    if(prev&&prevMap[r.student.id]){
      const p=prevMap[r.student.id];
      const common=Object.keys(r.ratings).filter(k=>r.ratings[k]!=null&&p.ratings[k]!=null);
      if(common.length>=2){
        const drop=common.reduce((a,k)=>a+p.ratings[k],0)-common.reduce((a,k)=>a+r.ratings[k],0);
        if(drop>=S.watch.drop)reasons.push("前学期比で評定合計が"+drop+"点低下（共通教科"+common.length+"教科で比較）");
      }
    }
    if(r.avg!=null){
      Object.entries(r.ratings).forEach(([k,v])=>{if(v!=null&&(v===1||v<=r.avg-1.5))reasons.push(k+"が突出して低い（評定"+v+"、平均"+fmt(r.avg)+"）");});
    }
    if(reasons.length)out.push({student:r.student,reasons});
  });
  return out;
}

      +agg.subjects.map(sub=>{const v=r.ratings[sub.name];let cls="";if(v!=null&&r.avg!=null){if(v<=r.avg-1.5)cls="low";else if(v>=r.avg+1.5)cls="high";}

    +"</table>"
    +'<p class="note">色：赤はその生徒の平均より大きく低い教科、緑は大きく高い教科です。</p>';

  else h+='<p class="note">現在のしきい値では、抽出される生徒はいません。</p>';
  h+="<h3>教科ごとの評定分布（"+grade+"年）</h3><table><tr><th>教科</th>"+[...Array(agg.scale).keys()].map(i=>"<th>評定"+(agg.scale-i)+"</th>").join("")+"</tr>"
    +agg.subjects.map(sub=>"<tr><td class=\"l\">"+esc(sub.name)+"</td>"+[...Array(agg.scale).keys()].map(i=>"<td>"+(agg.dist[sub.name][agg.scale-i]||0)+"</td>").join("")+"</tr>").join("")+"</table></div>";
  // other subjects input
  h+='<div class="card"><h2>他教科の評定入力</h2>'+purpose("他の先生の教科の評定を入れる場所です。グリッドに直接入力するか、CSVから取り込みます。")
    +'<p><input type="text" id="newOtherSubj" placeholder="教科名（例：国語）"> <button class="btn sub" onclick="addOtherSubj()">教科を追加</button></p>';
  if(d.otherSubjects.length){
    h+="<div style=\"overflow-x:auto\"><table><tr><th>クラス</th><th>氏名</th>"+d.otherSubjects.map(n=>"<th>"+esc(n)+"</th>").join("")+"</tr>"
      +agg.rows.map(r=>"<tr><td>"+esc(classLabel(getClass(r.student.classId)))+"</td><td class=\"l\">"+esc(r.student.name)+"</td>"
        +d.otherSubjects.map(n=>{const v=((d.otherGrades[term]||{})[r.student.id]||{})[n];return '<td><input type="number" min="1" max="'+agg.scale+'" style="width:48px" value="'+(v==null?"":v)+'" onchange="setOtherGrade(\''+r.student.id+"','"+esc(n)+"',this.value)\"></td>";}).join("")+"</tr>").join("")
      +"</table></div>";
  }
  h+="<h3>他教科の評定CSV取り込み（列マッピング）</h3>"
    +'<p><label class="btn sub" style="cursor:pointer">CSVファイルを選ぶ<input type="file" accept=".csv,.txt" style="display:none" onchange="otherCSV(this)"></label></p><div id="otherImpArea"></div></div>';
  return h;
}

function showOtherMapping(rows){

function doOtherImport(ncol){
  const rows=V.impRows;if(!rows)return;
  const m=otherMapFromUI(ncol);const d=YD();const term=S.ctx.term;const scale=ratingScale();
  const nameCol=m.cols.findIndex(c=>c.use==="name"),noCol=m.cols.findIndex(c=>c.use==="no"),clsCol=m.cols.findIndex(c=>c.use==="class");
  if(nameCol<0&&noCol<0){toast("氏名か出席番号の列を指定してください");return;}
  const subjCols=m.cols.map((c,i)=>({c,i})).filter(x=>x.c.use==="subject"&&x.c.subj);
  subjCols.forEach(x=>{if(!d.otherSubjects.includes(x.c.subj))d.otherSubjects.push(x.c.subj);});
  if(!d.otherGrades[term])d.otherGrades[term]={};
  const report={added:0,skipped:[],warnings:[]};const seen=new Set();
  for(let i=m.header?1:0;i<rows.length;i++){
    const r=rows[i];const get=c=>c>=0?(r[c]==null?"":String(r[c]).trim()):"";
    let stu=null;
    const nm=get(nameCol),noRaw=get(noCol),clsRaw=get(clsCol);
    const cands=d.students.filter(s=>s.status==="在籍"&&(nameCol<0||s.name===nm)&&(noCol<0||String(s.no)===noRaw));
    if(clsRaw){const mm=clsRaw.match(/(\d+)\s*年\s*(.+)/);if(mm){const cl=d.classes.find(c=>c.grade===parseInt(mm[1])&&c.name===mm[2].trim());stu=cands.find(s=>cl&&s.classId===cl.id)||null;}}
    else stu=cands.length===1?cands[0]:null;
    if(!stu){report.skipped.push({row:i+1,reason:"生徒を特定できませんでした（"+(nm||noRaw)+"）"});continue;}
    if(seen.has(stu.id)){report.skipped.push({row:i+1,reason:"重複："+stu.name+" の行が複数あります"});continue;}
    seen.add(stu.id);
    if(!d.otherGrades[term][stu.id])d.otherGrades[term][stu.id]={};
    subjCols.forEach(x=>{
      const raw=get(x.i);if(raw==="")return;
      const v=parseInt(raw);
      if(isNaN(v)||v<1||v>scale){report.warnings.push({row:i+1,reason:stu.name+" の "+x.c.subj+"「"+raw+"」は評定の範囲（1〜"+scale+"）外のため取り込みませんでした"});return;}
      d.otherGrades[term][stu.id][x.c.subj]=v;
    });
    report.added++;
  }
  save();
  let h='<div class="'+(report.skipped.length||report.warnings.length?"warnbox":"okbox")+'"><b>取り込み結果</b>：反映 '+report.added+" 人";
  if(report.skipped.length)h+="<br>スキップ "+report.skipped.length+" 件<ul>"+report.skipped.map(s=>"<li>"+s.row+"行目："+esc(s.reason)+"</li>").join("")+"</ul>";
  if(report.warnings.length)h+="<br>警告 "+report.warnings.length+" 件<ul>"+report.warnings.map(s=>"<li>"+s.row+"行目："+esc(s.reason)+"</li>").join("")+"</ul>";
  h+="</div>";
  document.getElementById("oImpReport").innerHTML=h;
  setTimeout(()=>renderAll(),4000);
}

function buildTemplateDraft(student,term,useGradePhrase){
  const d=YD();const memos=d.memos.filter(m=>m.sid===student.id&&m.term===term);
  const sents=[];const usedKw=new Set();
  if(useGradePhrase){
    const cl=getClass(student.classId);
    if(cl){const agg=aggregateData(term,cl.grade);const row=agg.rows.find(r=>r.student.id===student.id);
      if(row&&row.avg!=null)sents.push(row.avg>=4.5?"学習内容をよく理解し、意欲的に取り組んでいます。":row.avg>=3.5?"学習内容をおおむね理解し、真面目に取り組んでいます。":row.avg>=2.5?"基礎的な内容の定着に向けて、努力を続けています。":"学習に根気強く取り組み、少しずつ力を付けています。");}
  }
  MEMO_CATS.forEach(cat=>{
    const ms=memos.filter(m=>m.cat===cat);
    ms.forEach(m=>{TPL_KEYWORDS.forEach(([kw,sent])=>{if(m.text.includes(kw)&&!usedKw.has(sent)){usedKw.add(sent);sents.push(sent);}});});
    if(ms.length&&!ms.some(m=>TPL_KEYWORDS.some(([kw])=>m.text.includes(kw)))){
      const g=TPL_GENERIC[cat];const idx=Math.abs([...student.id].reduce((a,c)=>a+c.charCodeAt(0),0))%g.length;
      if(!usedKw.has(g[idx])){usedKw.add(g[idx]);sents.push(g[idx]);}
    }
  });
  if(!sents.length)sents.push("学習や学校生活のさまざまな場面で、まじめに取り組む姿が見られました。");
  sents.push("今後も、自分の良さを伸ばしながら、さらに成長していくことを期待しています。");
  return sents.join("");
}
function toPlain(text){
  const rules=[["ではありません。","ではない。"],["であります。","である。"],["です。","である。"],["でした。","だった。"],["ています。","ている。"],["ていました。","ていた。"],["ています","ている"],["でしょう。","だろう。"],["います。","いる。"],["きました。","きた。"],["なります。","なる。"],["あります。","ある。"],["くれます。","くれる。"],["もらいます。","もらう。"],["ました。","した。"],["ません。","ない。"]];
  let t=String(text);rules.forEach(([a,b])=>{t=t.split(a).join(b);});return t;
}
const CAUTION_WORDS=["できない","だめ","ダメ","怠け","悪い子","病気","入院","うつ","ADHD","発達障害","自閉症","障害名","いじめ","暴力","家庭の事情","離婚","死別"];
function checkComment(text){
  const out=[];
  CAUTION_WORDS.forEach(w=>{if(text.includes(w))out.push("「"+w+"」は所見で避けたい表現です。事実の断定や個人が特定される内容になっていないか確認してください。");});
  if(text.includes("。。"))out.push("句点が重なっています（。。）");
  if(text.includes("、、"))out.push("読点が重なっています（、、）");
  if(text.includes("  "))out.push("空白が連続しています");
  if(text.length>400)out.push("文字数が多めです（"+text.length+"字）。要録・通知表の欄に収まるか確認してください。");
  return out;
}

function anonymizeFor(student,term){
  const d=YD();const cl=getClass(student.classId);
  const classmates=cl?studentsOfClass(cl.id,true):[student];
  const map={};classmates.forEach((s,i)=>{map[s.id]="生徒"+String.fromCharCode(65+i);});
  const memos=d.memos.filter(m=>m.sid===student.id&&m.term===term);
  const alias=map[student.id]||"生徒A";
  let memoText=memos.map(m=>{
    let t=m.text;classmates.forEach(s=>{t=t.split(s.name).join(map[s.id]);});
    return "［"+m.cat+"］"+t;
  }).join("\n");
  return {map,alias,memoText};
}
function buildAIPrompt(student,term){
  const {alias,memoText}=anonymizeFor(student,term);
  const style=document.getElementById("commentStyle").value==="plain"?"である・した調":"です・ます調";
  let gradePart="";
  if(S.ai.sendGrade){
    const cl=getClass(student.classId);
    if(cl){const agg=aggregateData(term,cl.grade);const row=agg.rows.find(r=>r.student.id===student.id);
      if(row&&row.avg!=null)gradePart="\n学習面の様子："+(row.avg>=4.5?"とても良好":row.avg>=3.5?"良好":row.avg>=2.5?"おおむね良好":"努力を要する")+"（数値ではなく段階表現のみを渡しています）";}
  }
  return "あなたは中学校・高等学校の所見文を書く補助者です。次の日々の観察メモをもとに、生徒（"+alias+"）の所見文案を日本語で作成してください。\n条件：文末は"+style+"。200〜300字程度。メモにない事実は書かない。否定的な断定は避け、成長の様子が伝わる表現にする。氏名は書かず、主語は省略するか「"+alias+"」のままにする。\nメモ：\n"+(memoText||"（メモなし）")+gradePart+"\n文案だけを出力してください。";
}

  try{
    let text="";
    if(S.ai.provider==="gemini"){
      const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
      const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
      text=j.candidates[0].content.parts.map(p=>p.text||"").join("");
    }else if(S.ai.provider==="claude"){
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:800,messages:[{role:"user",content:prompt}]})});
      const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
      text=j.content.map(p=>p.text||"").join("");
    }else{
      const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model,messages:[{role:"user",content:prompt}]})});
      const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
      text=j.choices[0].message.content;
    }
    Object.entries(map).forEach(([sid,aliasName])=>{
      const real=YD().students.find(s=>s.id===sid);
      if(real)text=text.split(aliasName).join(real.name);
    });
    closeModal();
    document.getElementById("commentText").value=text.trim();
    toast("AI文案を生成しました。必ず内容を確認・修正してください");
  }catch(e){
    const el=document.getElementById("aiErr");
    if(el)el.innerHTML='<div class="badbox">生成に失敗しました：'+esc(e.message||e)+"</div>";
  }
}

/* ================= Attendance ================= */
function attendanceTotals(sid,term){
  const rec=(YD().attendance.rec[sid]||{})[term]||{};
  const t={abs:0,late:0,early:0,susp:0};
  monthsOfTerm(term).forEach(m=>{const r=rec[m]||{};t.abs+=+r.abs||0;t.late+=+r.late||0;t.early+=+r.early||0;t.susp+=+r.susp||0;});
  return t;
}
function attendanceDays(classId,term){
  const dd=(YD().attendance.days[classId]||{})[term]||{};
  return monthsOfTerm(term).reduce((a,m)=>a+(+dd[m]||0),0);
}
function viewAttendance(){
  const cid=homeClassId();const d=YD();const term=S.ctx.term;
  let h='<div class="card"><h2>出欠の記録</h2>'+purpose("担任クラスの月別の出欠（欠席・遅刻・早退・出席停止）を記録し、学期・年間の集計を通知表へ反映します。");
  if(!cid){h+='<p class="note">担任クラスが未登録です。</p></div>';return h;}
  const cls=getClass(cid);const months=monthsOfTerm(term);

  h+="<p><b>"+esc(cls?classLabel(cls):"")+" ／ "+esc(termLabel(term))+"</b></p>"
    +"<p>授業日数："+months.map(m=>m+'月 <input type="number" style="width:52px" value="'+(days[m]||"")+'" onchange="setAttDays(\''+m+'\',this.value)"> 日').join("　")+'</p>';
  const stus=studentsOfClass(cid,true);
  h+="<div style=\"overflow-x:auto\"><table><tr><th>番号</th><th>氏名</th>"+months.map(m=>"<th>"+m+"月<br><span class=\"note\">欠／遅／早／停</span></th>").join("")+"<th>学期計<br>欠／遅／早／停</th><th>年間計（欠席）</th></tr>"
    +stus.map(s=>{
      const rec=(d.attendance.rec[s.id]||{})[term]||{};

        return "<td>"+["abs","late","early","susp"].map(k=>'<input type="number" min="0" style="width:36px" title="'+k+'" value="'+(r[k]==null?"":r[k])+'" onchange="setAtt(\''+s.id+"','"+m+"','"+k+"',this.value)\">").join("/")+"</td>";}).join("")
        +"<td>"+t.abs+"／"+t.late+"／"+t.early+"／"+t.susp+"</td><td>"+yearAbs+"</td></tr>";
    }).join("")+"</table></div>"
    +'<p class="note">空欄は0として集計します。学期計と年間計は自動計算され、通知表に反映されます。</p></div>';
  return h;
}
function setAttDays(m,v){
  const d=YD();const cid=homeClassId();const term=S.ctx.term;
  if(!d.attendance.days[cid])d.attendance.days[cid]={};
  if(!d.attendance.days[cid][term])d.attendance.days[cid][term]={};
  d.attendance.days[cid][term][m]=parseInt(v)||0;save();
}
function setAtt(sid,m,k,v){
  const d=YD();const term=S.ctx.term;
  if(!d.attendance.rec[sid])d.attendance.rec[sid]={};
  if(!d.attendance.rec[sid][term])d.attendance.rec[sid][term]={};
  if(!d.attendance.rec[sid][term][m])d.attendance.rec[sid][term][m]={abs:0,late:0,early:0,susp:0};
  d.attendance.rec[sid][term][m][k]=parseInt(v)||0;save();renderAll();

const EXPORT_DEFS={
  grades:{label:"評定一覧（教科担当）",fields:[["no","出席番号"],["name","氏名"],["totalRate","総合得点率"],["abc1","観点1評価"],["abc2","観点2評価"],["abc3","観点3評価"],["rate1","観点1得点率"],["rate2","観点2得点率"],["rate3","観点3得点率"],["auto","自動評定"],["final","確定評定"],["classRank","クラス順位"],["gradeRank","学年順位"]]},
  record:{label:"指導要録データ（担任クラス）",fields:[["class","クラス"],["no","出席番号"],["name","氏名"],["subject","教科"],["abc1","観点1評価"],["abc2","観点2評価"],["abc3","観点3評価"],["final","評定"]]},
  aggregate:{label:"学年集約データ",fields:null}
};
function exportFields(dataset){
  if(dataset==="aggregate"){
    const agg=aggregateData(S.ctx.term,S.ctx.aggGrade);
    return [["class","クラス"],["no","出席番号"],["name","氏名"],...agg.subjects.map(s=>["sub_"+s.name,s.name]),["total","評定合計"],["avg","評定平均"],["gradeRank","学年順位"],["classRank","クラス順位"]];
  }
  return EXPORT_DEFS[dataset].fields;
}
function outMap(dataset){
  if(!S.exportMaps)S.exportMaps={};
  if(!S.exportMaps[dataset]){
    const m={};exportFields(dataset).forEach((f,i)=>{m[f[0]]={name:f[1],order:i,use:true};});
    S.exportMaps[dataset]=m;
  }
  return S.exportMaps[dataset];
}
function orderedFields(dataset){
  const m=outMap(dataset);
  return exportFields(dataset).filter(f=>m[f[0]]&&m[f[0]].use).sort((a,b)=>(m[a[0]].order||0)-(m[b[0]].order||0));
}
function exportData(dataset){
  const d=YD();const term=S.ctx.term;const warnings=[];
  if(dataset==="grades"){
    const asg=curAssignment();if(!asg)return{rows:[],warnings:["教科担当の対象が選ばれていません"],raw:[]};
    const res=computeSubject(asg.subjectId,asg.classId,term);
    const raw=res.rows.map(r=>{
      const missing=r.per.filter(p=>p.rate==null).length;
      if(missing)warnings.push(r.student.name+"：素点の未入力が"+missing+"件あります");
      if(r.final==null)warnings.push(r.student.name+"：評定が未確定です");
      if(r.adj&&r.adj.rating!=null&&r.base!=null&&r.adj.rating!==r.base&&!r.adj.reason)warnings.push(r.student.name+"：人間調整の理由が未記入です");
      return {no:r.student.no,name:r.student.name,totalRate:fmt(r.totalRate),abc1:r.abcs[0]||"",abc2:r.abcs[1]||"",abc3:r.abcs[2]||"",rate1:fmt(r.viewRates[0]),rate2:fmt(r.viewRates[1]),rate3:fmt(r.viewRates[2]),auto:r.base==null?"":r.base,final:r.final==null?"":r.final,classRank:r.classRank||"",gradeRank:r.gradeRank||""};
    });
    return {rows:raw,warnings,raw};
  }
  if(dataset==="record"){
    const cid=homeClassId();if(!cid)return{rows:[],warnings:["担任クラスが未登録です"],raw:[]};
    const cl=getClass(cid);const agg=aggregateData(term,cl.grade);const details=ownSubjectDetails(cid,term);
    const raw=[];
    agg.rows.filter(r=>r.student.classId===cid).forEach(r=>{
      agg.subjects.forEach(sub=>{
        const det=details[r.student.id]&&details[r.student.id][sub.name];
        const f=r.ratings[sub.name];
        if(f==null)warnings.push(r.student.name+"："+sub.name+" の評定が未確定です");
        raw.push({class:classLabel(cl),no:r.student.no,name:r.student.name,subject:sub.name,abc1:det?(det.abcs[0]||""):"",abc2:det?(det.abcs[1]||""):"",abc3:det?(det.abcs[2]||""):"",final:f==null?"":f});
      });
    });
    return {rows:raw,warnings,raw};
  }
  const agg=aggregateData(term,S.ctx.aggGrade);
  const raw=agg.rows.map(r=>{
    const o={class:classLabel(getClass(r.student.classId)),no:r.student.no,name:r.student.name,total:r.total==null?"":r.total,avg:fmt(r.avg),gradeRank:r.gradeRank||"",classRank:r.classRank||""};
    agg.subjects.forEach(sub=>{o["sub_"+sub.name]=r.ratings[sub.name]==null?"":r.ratings[sub.name];if(r.ratings[sub.name]==null)warnings.push(r.student.name+"："+sub.name+" の評定が未入力です");});
    return o;
  });
  return {rows:raw,warnings,raw};
}

    +'<div class="btnrow"><button class="btn" onclick="runExport(\''+ds+'\')">チェックして書き出す</button>'

function setOutMap(ds,k,prop,v){const m=outMap(ds);if(prop==="order")m[k].order=parseInt(v)||0;else if(prop==="use")m[k].use=v;else m[k].name=v;save();if(prop==="order"||prop==="use")renderAll();}
function applyOutPreset(ds){
  const sel=document.getElementById("outPresetSel");if(!sel||!sel.value)return;
  const p=getPresets("export",ds).find(x=>x.id===sel.value);if(!p)return;
  if(!S.exportMaps)S.exportMaps={};S.exportMaps[ds]=clone(p.map);save();renderAll();toast("プリセットを適用しました");
}
function saveOutPreset(ds){
  const name=document.getElementById("outPresetName").value.trim();if(!name){toast("プリセット名を入れてください");return;}
  savePreset("export",ds,name,outMap(ds),document.getElementById("outEnc").value);renderAll();toast("プリセットを保存しました");
}
function runExport(ds){
  const {rows,warnings}=exportData(ds);
  const fields=orderedFields(ds);const m=outMap(ds);
  const doIt=()=>{
    const enc=document.getElementById("outEnc")?document.getElementById("outEnc").value:"sjis";
    const format=document.getElementById("outFormat")?document.getElementById("outFormat").value:"csv";
    const header=fields.map(f=>m[f[0]].name);
    const data=rows.map(r=>fields.map(f=>r[f[0]]==null?"":r[f[0]]));
    const fname="tsunagu-"+ds+"-"+S.ctx.year+"-"+S.ctx.term;
    if(format==="excel"){
      const html="<html xmlns:x='urn:schemas-microsoft-com:office:excel'><head><meta charset='UTF-8'></head><body><table border='1'><tr>"+header.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr>"+data.map(r=>"<tr>"+r.map(v=>"<td>"+esc(v)+"</td>").join("")+"</tr>").join("")+"</table></body></html>";
      if(enc==="sjis")download(fname+".xls",sjisEncode(html),"application/vnd.ms-excel");
      else download(fname+".xls",html,"application/vnd.ms-excel;charset=utf-8");
    }else{
      downloadCSV(fname+".csv",[header,...data],enc);
    }
    toast("書き出しました");
  };
  if(warnings.length){
    modal("<h3 style=\"margin-top:0\">書き出し前チェック</h3><p>次の未入力・未確定があります。このまま書き出しますか？</p><div class=\"warnbox\" style=\"max-height:40vh;overflow-y:auto\"><ul>"+warnings.slice(0,60).map(w=>"<li>"+esc(w)+"</li>").join("")+"</ul>"+(warnings.length>60?"<p>ほか"+(warnings.length-60)+"件</p>":"")+'</div><div class="btnrow"><button class="btn" id="expGo">このまま書き出す</button><button class="btn sub" onclick="closeModal()">やめる</button></div>');
    document.getElementById("expGo").onclick=()=>{closeModal();doIt();};
  }else doIt();
}
function printReportCards(){
  const cid=homeClassId();if(!cid)return;
  const html=studentsOfClass(cid,true).map(s=>reportCardHtml(s.id)).join("");
  printSheets(html,"通知表（クラス一括）");
}
function printRecord(){
  const cid=homeClassId();if(!cid)return;
  printSheets(recordSheetHtml(cid),"指導要録 学習の記録");
}
/* ================= Boot ================= */
load();
ensureMaps();
renderAll();
</script>
